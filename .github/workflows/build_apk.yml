name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create Package Archive
        run: |
          mkdir -p output
          cp app.py output/app.py
          echo "Piping Suite v10.0 - Eng. Ibrahim Baaloul" > output/version.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: piping-suite-app
          path: output/
