name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Save App
        run: |
          mkdir -p dist
          cp app.py dist/app.py

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: dist/
