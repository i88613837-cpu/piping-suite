name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Simple Build
        run: |
          mkdir -p release
          cp app.py release/app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: release/
